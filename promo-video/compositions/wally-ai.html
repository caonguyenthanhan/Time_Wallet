      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const fullText = "Sáng học AI 1h30, đọc sách 45p, chạy bộ 30p";
          const typedEl = document.getElementById("wally-typed-text");
          const typeProxy = { chars: 0 };

          function renderTyped(n) {
            const count = Math.max(1, Math.round(n));
            typedEl.textContent = fullText.slice(0, count);
          }

          tl.fromTo(
            "#wally-phone",
            { opacity: 0.9, y: 12, scale: 1.03 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power4.out" },
            0
          );

          tl.fromTo(
            "#wally-mascot-box",
            { opacity: 0, y: 24, scale: 0.9 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)" },
            0.12
          );

          // Word-by-word contrast reveal without position jump
          tl.fromTo(
            "#wally-headline .word:not(.accent)",
            { color: "#A0AEA5" },
            { color: "#172B27", duration: 0.16, stagger: 0.08, ease: "none" },
            0.22
          );
          tl.fromTo(
            "#wally-headline .word.accent",
            { color: "#A0AEA5" },
            { color: "#176B57", duration: 0.16, stagger: 0.08, ease: "none" },
            0.62
          );

          tl.fromTo(
            "#wally-sub",
            { opacity: 0, filter: "blur(5px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
            0.9
          );

          tl.fromTo(
            "#wally-chat-panel",
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.48, ease: "power4.out" },
            0.45
          );

          // Type prompt cleanly & briskly
          tl.fromTo(
            typeProxy,
            { chars: 1 },
            {
              chars: fullText.length,
              duration: 1.25,
              ease: "none",
              onUpdate: function () {
                renderTyped(typeProxy.chars);
              },
            },
            1.15
          );

          // Typing indicator pulse then collapses cleanly before proposals enter
          tl.fromTo(
            "#wally-typing-dots",
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" },
            2.15
          );
          tl.fromTo(
            "#wally-typing-dots .dot-item",
            { y: 0, opacity: 0.45 },
            { y: -6, opacity: 1, duration: 0.2, stagger: 0.08, yoyo: true, repeat: 4, ease: "power1.inOut" },
            2.3
          );
          tl.to(
            "#wally-typing-dots",
            { opacity: 0, height: 0, paddingTop: 0, paddingBottom: 0, overflow: "hidden", duration: 0.22, ease: "power2.in" },
            4.0
          );

          // 3 Proposal rows stagger in cleanly
          tl.fromTo(
            "#wally-proposals .proposal-row",
            { opacity: 0, y: 18, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.38, stagger: 0.14, ease: "back.out(1.4)" },
            4.1
          );

          tl.fromTo(
            "#wally-confirm-btn",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
            4.65
          );

          // Cursor clicks Confirm at 5.90s
          tl.fromTo(
            "#wally-cursor",
            { x: 1850, y: 1020, opacity: 0 },
            { x: 1120, y: 865, opacity: 1, duration: 0.65, ease: "power2.inOut" },
            5.15
          );

          tl.fromTo("#wally-confirm-btn", { scale: 1 }, { scale: 0.96, duration: 0.09, ease: "power2.in" }, 5.86);
          tl.to("#wally-confirm-btn", { scale: 1, backgroundColor: "#103F35", duration: 0.16, ease: "power3.out" }, 5.95);

          tl.fromTo(
            "#wally-verified-badge",
            { opacity: 0, scale: 0.88 },
            { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.6)" },
            6.02
          );
          tl.fromTo(
            "#wally-tick-path",
            { strokeDashoffset: 32 },
            { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" },
            6.1
          );
          tl.to("#wally-cursor", { opacity: 0, duration: 0.25 }, 6.3);

          // Velocity-matched whip exit to Schedule
          tl.fromTo(
            "#wally-stage",
            { x: 0, opacity: 1 },
            { x: -120, opacity: 0.85, duration: 0.36, ease: "power3.in" },
            8.1
          );

          tl.to({}, { duration: 0.01 }, 8.49);
          renderTyped(fullText.length);
          window.__timelines = window.__timelines || {};
          window.__timelines["wally-ai"] = tl;
          tl.seek(0);
        })();
      </script>
