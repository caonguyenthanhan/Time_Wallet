      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const weekEl = document.getElementById("ins-week-total");
          const donutValEl = document.getElementById("donut-val");
          const donutSubEl = document.getElementById("donut-sub");
          const weekProxy = { mins: 0 };

          function renderWeek(m) {
            const total = Math.round(m);
            const h = Math.floor(total / 60);
            const rem = total % 60;
            weekEl.textContent = h + "h " + String(rem).padStart(2, "0");
          }

          tl.fromTo(
            "#ins-head",
            { opacity: 0, filter: "blur(6px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
            0.15
          );

          tl.fromTo(
            "#ins-bars-card, #ins-donut-card, #ins-phone",
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.52, stagger: 0.1, ease: "power4.out" },
            0.08
          );

          // Weekly counter & bars grow
          tl.fromTo(
            weekProxy,
            { mins: 0 },
            {
              mins: 106 * 60 + 15,
              duration: 1.5,
              ease: "power3.out",
              onUpdate: function () {
                renderWeek(weekProxy.mins);
              },
            },
            0.5
          );

          tl.fromTo(
            ".bar-fill",
            { scaleY: 0 },
            { scaleY: 1, duration: 0.72, stagger: 0.07, ease: "power4.out" },
            0.7
          );

          // 2D Donut slice pop at 2.75s
          tl.fromTo(
            "#slice-sleep",
            { x: 0, y: 0 },
            { x: 6, y: -5, duration: 0.44, ease: "back.out(1.6)" },
            2.75
          );

          tl.to(
            "#leg-sleep",
            {
              backgroundColor: "#DCF3E8",
              color: "#176B57",
              duration: 0.3,
              onStart: function () {
                donutValEl.textContent = "6h 30";
                donutSubEl.textContent = "Ngủ 44%";
              },
              onReverseComplete: function () {
                donutValEl.textContent = "14h 50";
                donutSubEl.textContent = "hôm nay";
              },
            },
            2.8
          );

          tl.fromTo(
            "#ins-coach",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            1.45
          );

          tl.fromTo(
            "#ins-coach-action",
            { opacity: 0, scale: 0.9, y: 6 },
            { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(1.6)" },
            4.45
          );

          // Match cut iris out to End Card
          tl.fromTo(
            "#ins-iris",
            { opacity: 0, clipPath: "circle(0% at 50% 50%)" },
            { opacity: 1, clipPath: "circle(110% at 50% 50%)", duration: 0.45, ease: "power2.inOut" },
            6.02
          );

          tl.to({}, { duration: 0.01 }, 6.49);
          renderWeek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["insights"] = tl;
          tl.seek(0);
        })();
      </script>
