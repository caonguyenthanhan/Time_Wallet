      <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
        <div class="hook-bg-tint" data-layout-ignore="true"></div>
        <div class="hook-grain" data-layout-ignore="true"></div>

        <div id="hook-stage-clip" class="clip" data-start="0" data-duration="7" style="position: absolute; inset: 0;">
          <div class="hook-stage">
            <div class="hook-left">
              <div id="hook-accent-bar" class="hook-accent-bar" data-layout-ignore="true"></div>

              <h1 id="hook-title" class="hook-title">Time Wallet</h1>

              <p id="hook-lead" class="hook-lead">
                Hiểu <span class="accent">24 giờ</span> của chính bạn

        <div id="hook-cursor-clip" class="clip hook-cursor-layer" data-start="5.5" data-duration="1.5">

              <path
                d="M6 3L26 15L16.5 17.5L13 27L6 3Z"

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const hoursEl = document.getElementById("hook-hours-text");
          const countProxy = { mins: 0 };

          function renderMinutes(m) {
            const total = Math.round(m);
            const h = Math.floor(total / 60);
            const rem = total % 60;
            hoursEl.textContent =
              String(h).padStart(2, "0") + "h " + String(rem).padStart(2, "0");
          }

          // Frame 0 non-empty: card and bar start visible, title smoothly fades in
          tl.fromTo(
            "#hook-accent-bar",
            { scaleX: 0.25, opacity: 0.7 },
            { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
            0
          );

          tl.fromTo(
            "#hook-title",
            { opacity: 0, filter: "blur(8px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.85, ease: "power3.out" },
            0.15
          );

          tl.fromTo(
            "#hook-lead",
            { opacity: 0, filter: "blur(6px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
            0.85
          );

          tl.fromTo(
            "#hook-sub",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
            1.35
          );

          tl.fromTo(
            "#hook-pills .pill-solid, #hook-pills .pill-dashed",
            { opacity: 0, y: 16, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.42, stagger: 0.14, ease: "back.out(1.4)" },
            2.35
          );

          // Hero Wallet Card settles and animates 14h 50 progress
          tl.fromTo(
            "#hook-hero-card",
            { opacity: 0.88, y: 14, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power4.out" },
            0
          );

          tl.fromTo(
            "#hook-bar-fill",
            { scaleX: 0.04 },
            { scaleX: 14.833 / 24, duration: 2.0, ease: "power3.out" },
            0.55
          );

          tl.fromTo(
            countProxy,
            { mins: 0 },
            {
              mins: 890,
              duration: 2.0,
              ease: "power3.out",
              onUpdate: function () {
                renderMinutes(countProxy.mins);
              },
            },
            0.55
          );

          tl.fromTo(
            "#hook-planned-row",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            2.5
          );

          tl.fromTo(
            "#qa-timer, #qa-add, #qa-wally",
            { opacity: 0, y: 20, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.44, stagger: 0.08, ease: "back.out(1.4)" },
            3.25
          );

          // Cursor glides in to click "Đồng hồ" and launch Scene 2
          tl.fromTo(
            "#hook-cursor",
            { x: 1860, y: 1060, opacity: 0 },
            { x: 1065, y: 765, opacity: 1, duration: 0.85, ease: "power2.inOut" },
            5.65
          );

          tl.fromTo(
            "#qa-timer",
            { scale: 1 },
            { scale: 0.94, duration: 0.1, ease: "power2.in" },
            6.62
          );
          tl.to(
            "#qa-timer",
            { scale: 1.03, borderColor: "#176B57", duration: 0.16, ease: "power3.out" },
            6.72
          );

          tl.fromTo(
            ".hook-stage",
            { opacity: 1, scale: 1 },
            { opacity: 1, scale: 1.035, duration: 0.25, ease: "power3.in" },
            6.74
          );

          tl.to({}, { duration: 0.01 }, 6.99);
          window.__timelines = window.__timelines || {};
          window.__timelines["hook"] = tl;
          tl.seek(0);
        })();
      </script>
