      <div id="root" data-composition-id="timer" data-width="1920" data-height="1080">
        <div class="timer-grain" data-layout-ignore="true"></div>

        <div id="timer-stage-clip" class="clip" data-start="0" data-duration="7.5" style="position: absolute; inset: 0;">
          <div id="timer-stage" class="timer-stage">
            <div id="timer-phone" class="phone-shell">
              <div class="phone-screen">
                <img src="assets/screens/02_dong-ho.png" alt="Time Wallet Timer" />
              </div>
              <div class="phone-camera" data-layout-ignore="true"></div>

                    <circle

                    />
                    <circle

                      cx="170"

                      fill="none"

                      stroke-linecap="round"

                  <div class="timer-input-box">Deep Work — Thiết kế hệ thống</div>

                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12c5 4 13 4 18 0"/></svg>

                    </div>

              <path
                d="M6 3L26 15L16.5 17.5L13 27L6 3Z"

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const digitsEl = document.getElementById("timer-digits");
          const statusEl = document.getElementById("timer-status");
          const ctaEl = document.getElementById("timer-cta");
          const arcEl = document.getElementById("timer-ring-arc");
          const clockProxy = { sec: 0 };

          function renderTimer(sec) {
            const s = Math.round(sec);
            const mins = Math.floor(s / 60);
            const rem = s % 60;
            digitsEl.textContent =
              String(mins).padStart(2, "0") + " : " + String(rem).padStart(2, "0");

            const active = s > 0;
            statusEl.textContent = s >= 2700 ? "● Đã đo xong" : active ? "● Đang đo" : "Sẵn sàng";
            statusEl.style.background = active ? "#DCF3E8" : "#EDF6F0";
            statusEl.style.color = active ? "#176B57" : "#5A7268";
            ctaEl.textContent = s >= 2700 ? "✓ Đã ghi vào Sổ cái" : active ? "⏸ Kết thúc & Lưu" : "▶ Bắt đầu đo";
            ctaEl.style.background = active ? "#103F35" : "#176B57";
            const dash = 918 * (1 - (s / 3600));
            arcEl.setAttribute("stroke-dashoffset", dash.toFixed(1));
          }

          tl.fromTo(
            "#timer-phone",
            { opacity: 0.92, x: -24, scale: 1.04 },
            { opacity: 1, x: 0, scale: 1, duration: 0.58, ease: "power4.out" },
            0
          );

          tl.fromTo(
            "#timer-head",
            { opacity: 0, clipPath: "inset(0 100% 0 0)" },
            { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.62, ease: "power4.out" },
            0.15
          );

          tl.fromTo(
            "#timer-module",
            { opacity: 0, y: 26, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power4.out" },
            0.35
          );

          tl.fromTo(
            "#timer-chips .chip-pill",
            { opacity: 0, y: 12, scale: 0.92 },
            { opacity: 1, y: 0, scale: 1, duration: 0.36, stagger: 0.07, ease: "back.out(1.4)" },
            0.65
          );

          // Cursor enters and presses Start at 1.80s
          tl.fromTo(
            "#timer-cursor",
            { x: 1850, y: 980, opacity: 0 },
            { x: 1370, y: 740, opacity: 1, duration: 0.72, ease: "power2.inOut" },
            0.95
          );

          tl.fromTo(
            "#timer-cta",
            { scale: 1 },
            { scale: 0.96, duration: 0.09, ease: "power2.in" },
            1.76
          );
          tl.to("#timer-cta", { scale: 1, duration: 0.16, ease: "power3.out" }, 1.85);

          tl.to("#timer-cursor", { opacity: 0, x: 1450, y: 800, duration: 0.3, ease: "power2.in" }, 2.0);

          // Live measurement: 00:00 -> 45:00
          tl.fromTo(
            clockProxy,
            { sec: 0 },
            {
              sec: 2700,
              duration: 3.6,
              ease: "power1.inOut",
              onUpdate: function () {
                renderTimer(clockProxy.sec);
              },
            },
            1.88
          );

          tl.fromTo(
            "#timer-saved",
            { opacity: 0, y: 10, scale: 0.92 },
            { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "back.out(1.5)" },
            5.55
          );

          // Exit morph handoff to Wally AI
          tl.fromTo(
            "#timer-stage",
            { opacity: 1, scale: 1 },
            { opacity: 0.88, scale: 0.97, duration: 0.32, ease: "power3.in" },
            7.16
          );

          tl.to({}, { duration: 0.01 }, 7.49);
          renderTimer(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["timer"] = tl;
          tl.seek(0);
        })();
      </script>
