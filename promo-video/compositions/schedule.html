      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const diffEl = document.getElementById("sched-diff-label");
          const diffProxy = { mins: 60 };

          function renderDiff(m) {
            const total = Math.round(m);
            const extra = total - 60;
            diffEl.textContent =
              extra > 0
                ? "KH 1h → TT 1h " + String(extra).padStart(2, "0") + "p (+" + extra + "p)"
                : "KH 1h → TT 1h 00p";
          }

          // Whip catch arrival from right
          tl.fromTo(
            "#sched-head",
            { x: 110, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.52, ease: "power4.out" },
            0
          );

          tl.fromTo(
            "#sched-card",
            { x: 90, opacity: 0.85 },
            { x: 0, opacity: 1, duration: 0.56, ease: "power4.out" },
            0.04
          );

          tl.fromTo(
            "#sched-phone",
            { x: 70, opacity: 0.85, scale: 0.96 },
            { x: 0, opacity: 1, scale: 1, duration: 0.56, ease: "power4.out" },
            0.05
          );

          // Mode pill glides Ngày -> 3 ngày -> Tuần -> Ngày with matching dark contrast text
          tl.fromTo(
            "#sched-mode-pill",
            { x: 0 },
            { x: 266, duration: 0.36, ease: "power2.inOut" },
            1.4
          );
          tl.to("#tab-ngay", { color: "#DCF3E8", duration: 0.16 }, 1.48);
          tl.to("#tab-3ngay", { color: "#103F35", duration: 0.16 }, 1.56);

          tl.to("#sched-mode-pill", { x: 532, duration: 0.36, ease: "power2.inOut" }, 1.95);
          tl.to("#tab-3ngay", { color: "#DCF3E8", duration: 0.16 }, 2.02);
          tl.to("#tab-tuan", { color: "#103F35", duration: 0.16 }, 2.1);

          tl.to("#sched-mode-pill", { x: 0, duration: 0.42, ease: "power3.out" }, 2.55);
          tl.to("#tab-tuan", { color: "#DCF3E8", duration: 0.16 }, 2.6);
          tl.to("#tab-ngay", { color: "#103F35", duration: 0.18 }, 2.74);

          // Side-by-side Planned vs Actual blocks pop in & Actual expands by +12p
          tl.fromTo(
            "#sched-planned-block",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            2.95
          );

          tl.fromTo(
            "#sched-actual-block",
            { opacity: 0, y: 14, scaleY: 0.88 },
            { opacity: 1, y: 0, scaleY: 1, duration: 0.45, ease: "power3.out" },
            3.25
          );

          tl.fromTo(
            diffProxy,
            { mins: 60 },
            {
              mins: 72,
              duration: 1.15,
              ease: "power2.out",
              onUpdate: function () {
                renderDiff(diffProxy.mins);
              },
            },
            3.85
          );

          tl.fromTo(
            "#sched-actual-block",
            { paddingBottom: 18 },
            { paddingBottom: 34, duration: 1.15, ease: "power2.out" },
            3.85
          );

          // Highlight unplaced tray
          tl.fromTo(
            "#sched-unplaced-tray",
            { backgroundColor: "#EDF6F0", borderColor: "#DDE8E0", scale: 1 },
            { backgroundColor: "#DCF3E8", borderColor: "#176B57", scale: 1.015, duration: 0.42, ease: "back.out(1.4)" },
            5.45
          );

          // Colour flood transition into dark emerald Insights stage
          tl.fromTo(
            "#sched-flood",
            { opacity: 0, clipPath: "circle(0% at 50% 25%)" },
            { opacity: 1, clipPath: "circle(135% at 50% 25%)", duration: 0.5, ease: "power2.inOut" },
            7.48
          );

          tl.to({}, { duration: 0.01 }, 7.99);
          renderDiff(60);
          window.__timelines = window.__timelines || {};
          window.__timelines["schedule"] = tl;
          tl.seek(0);
        })();
      </script>
